apiVersion: v1
kind: Pod
metadata:
  name: my-pod-webserver
  labels:
    apps: my-app
    tier: frontend

spec:
  containers:
  - name: my-container-nginx
    image: nginx
  - name: my-container-web2
    image: gcr.io/google-samples/hello-app:1.0
    ports:
      - containerPort: 8080
