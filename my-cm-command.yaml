kind: ConfigMap
apiVersion: v1
metadata:
  name: my-cm
data:
  # Configuração de banco de dados
  database: mysql
  database_url: mysql://localhost:3306

---
kind: Pod
apiVersion: v1
metadata:
  name: pod-cm-env
spec:
  containers:
  - name: my-container
    image: nginx
    envFrom:
    - configMapRef:
        name: my-cm
    command:
    - "bin/sh"
    - "-c"
    - "echo My Database = $database - $database_url"
  restartPolicy: Never

