apiVersion: v1
kind: Pod
metadata:
  name: my-web-pod
  labels:
    type: web-app
spec: 
  containers:
    - name: web-server-apache
      image: httpd
      ports:
       - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport-service
spec:
  type: NodePort
  selector:
    type: web-app
  ports: 
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30008
