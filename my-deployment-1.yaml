apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
  annotations:
    kubernetes.io/change-cause: "Upgrade para versão  do Nginx 1.14.2"

spec:
  template:
    metadata:
      name: pod-my-nginx
      labels:
        env: production
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.14.2
  selector:
    matchLabels:
      env: production
  strategy:
    type: Recreate
  replicas: 5

