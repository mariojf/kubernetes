apiVersion: v1
kind: Service
metadata: 
  name: servico-sts-gia
spec:
  ports:
  - port: 80
  clusterIP: None
  selector: 
    app: nginx-app-pods

---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: my-sts
spec:
  selector:
    matchLabels:
      app: nginx-app-pods
  serviceName: "servico-sts-gia"
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx-app-pods
    spec:
      containers:
      - name: my-container-gia
        image: nginx:1.23.1

        command:
          - /bin/sh
          - -c
          - |
            sed "s/__HOSTNAME__/${HOSTNAME}/g" \
                /tmp/index.html.template \
                > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'

        volumeMounts:
        - name: my-pv
          mountPath: /usr/share/nginx/html

        - name: gia-index-template
          mountPath: /tmp/index.html.template
          subPath: index.html.template

      volumes: 
        - name: gia-index-template
          configMap:
            name: gia-index-template

  volumeClaimTemplates:
  - metadata:
      name: my-pv
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1    #Incluido o serviço externo ao Cluster kubernetes - minikube.
kind: Service
metadata:
  name: my-frontend-gia-node-port
spec:
  type: NodePort
  selector:
    app: nginx-app-pods
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gia-index-template
data:
  index.html.template: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>GIA Canonical Training Simulator</title>
    </head>
    <body>
      <h1>GIA Canonical Training Simulator</h1>

      <p>Você está sendo atendido pelo Pod:</p>
      <h2>__HOSTNAME__</h2>

      <p>
        <a href="GIA_Canonical_Training_Simulator.html">
          Acessar o GIA Canonical Training Simulator
        </a>
      </p>
    </body>
    </html>
